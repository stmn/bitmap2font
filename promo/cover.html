<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 630px;
  height: 500px;
  background: #14161a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 44px;
  overflow: hidden;
}
/* mock arkusza glifów z siatką jak w apce */
.sheet {
  background: #1d2026;
  padding: 18px;
  border-radius: 8px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(8, 54px);
  grid-auto-rows: 54px;
  background: rgba(240, 180, 41, 0.5);
  gap: 1px;
  padding: 1px;
}
.cell {
  background: #101216;
  display: flex;
  align-items: center;
  justify-content: center;
  font: 32px "Press Start 2P";
  color: #e8eaed;
  image-rendering: pixelated;
  -webkit-font-smoothing: none;
}
.cell.a { color: #f0b429; }
.title {
  font: 40px "Press Start 2P";
  color: #e8eaed;
  -webkit-font-smoothing: none;
}
.title span { color: #f0b429; }
.sub {
  font: 15px ui-monospace, Menlo, monospace;
  color: #8b919c;
  letter-spacing: 0.06em;
}
.sub b { color: #e8eaed; font-weight: 600; }
</style>
</head>
<body>
  <div class="sheet">
    <div class="grid">
      <div class="cell">A</div><div class="cell">B</div><div class="cell">C</div><div class="cell a">a</div><div class="cell">b</div><div class="cell">c</div><div class="cell">?</div><div class="cell">!</div>
      <div class="cell">0</div><div class="cell">1</div><div class="cell">2</div><div class="cell">3</div><div class="cell a">&amp;</div><div class="cell">x</div><div class="cell">y</div><div class="cell">z</div>
    </div>
  </div>
  <div class="title">bitmap<span>2</span>font</div>
  <div class="sub">PNG glyph sheet <b>&gt;&gt;</b> real <b>TTF / OTF</b> font</div>
</body>
</html>
